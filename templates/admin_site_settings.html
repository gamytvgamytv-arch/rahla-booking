{% extends "base.html" %}{% block title %}إعدادات الموقع{% endblock %}{% block content %}<section class="simple-page admin-page"><p class="eyebrow">الهوية التجارية</p><h1>إعدادات الموقع</h1><form class="auth-form" method="post"><label>اسم المنصة بالعربية<input name="site_name" value="{{ settings.get('site_name','') }}"></label><label>الشعار التعريفي<input name="site_tagline" value="{{ settings.get('site_tagline','') }}"></label><label>البريد<input type="email" name="contact_email" value="{{ settings.get('contact_email','') }}"></label><label>الهاتف<input name="contact_phone" value="{{ settings.get('contact_phone','') }}"></label><label>اللون الأساسي<input type="text" name="primary_color" value="{{ settings.get('primary_color','') }}"></label><label>لون المساندة<input type="text" name="accent_color" value="{{ settings.get('accent_color','') }}"></label><label>أماكن الإعلانات<input name="ad_slots" value="{{ settings.get('ad_slots','') }}"></label><label>باقات الترويج<input name="promotion_packages" value="{{ settings.get('promotion_packages','') }}"></label><button class="button button-accent">حفظ</button></form></section>{% endblock %}
