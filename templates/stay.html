{% extends "base.html" %}{% block title %}{{ stay.name }}{% endblock %}
{% block content %}<section class="detail-page"><a class="back-link" href="{{ url_for('home') }}">→ العودة إلى الاستكشاف</a><div class="detail-image {{ stay.image }}"><span>إقامة مختارة</span></div><div class="detail-layout"><div><div class="stay-meta"><span>{{ stay.location }}</span><strong>★ {{ stay.rating }}</strong></div><h1>{{ stay.name }}</h1><p class="large-copy">{{ stay.description }}</p><div class="detail-notes"><span>✓ إلغاء مرن</span><span>✓ تسجيل وصول ذاتي</span><span>✓ دعم طوال الرحلة</span></div></div><aside class="booking-box"><div><b>${{ stay.price }}</b> / ليلة</div><form method="post"><label>تسجيل الوصول<input required type="date" name="check_in"></label><label>تسجيل المغادرة<input required type="date" name="check_out"></label><label>عدد الضيوف<select name="guests"><option value="1">ضيف واحد</option><option value="2">ضيفان</option><option value="3">3 ضيوف</option><option value="4">4 ضيوف</option></select></label><button class="button button-accent full" type="submit">احجز هذه الإقامة</button></form></aside></div></section>{% endblock %}
