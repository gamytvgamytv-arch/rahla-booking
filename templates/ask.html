{% extends "base.html" %}{% block title %}اسأل مختصًا{% endblock %}{% block content %}<section class="auth-page"><div class="auth-form"><p class="eyebrow">سؤال واضح، إجابات أفضل</p><h1>اسأل مختصًا</h1><p class="muted">السؤال المجاني مختصر، والمدفوع يسمح بتفاصيل أكثر. كلاهما لا يغني عن الطوارئ أو التشخيص المباشر.</p><form method="post"><label>عنوان السؤال<input required name="subject"></label><label>التخصص<select name="specialty"><option>عام</option><option>صحة نفسية</option><option>أطفال</option><option>قلب وأوعية دموية</option><option>تحاليل وتشخيص</option><option>تأهيل وعلاج طبيعي</option><option>صحة المرأة</option></select></label><label>لغة السؤال<input required name="language" value="العربية"></label><label>البلد (اختياري)<input name="country"></label><label>نوع السؤال<select name="question_type"><option>مجاني</option><option>مدفوع</option></select></label><label>السؤال<textarea required minlength="10" name="question" rows="7"></textarea></label><button class="button button-accent full">إرسال السؤال</button></form></div></section>{% endblock %}
