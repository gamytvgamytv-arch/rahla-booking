<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سهل وبسيط — المنصة الطبية المتكاملة</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      'use strict';

      const root = document.getElementById('app');
      if (!root) return;

      const LANGS = {
        ar: 'العربية', ru: 'Русский', uz: 'O‘zbekcha',
        hy: 'Հայերեն', tg: 'Тоҷикӣ', uk: 'Українська',
        az: 'Azərbaycanca', ka: 'ქართული'
      };

      const I18N = {
        ar: { home:'الرئيسية', specialists:'الأخصائيون', questions:'الأسئلة والاستشارات', dashboard:'لوحتي', login:'دخول', ask:'اطرح سؤالاً', search:'بحث', slogan:'منصة سهلة وبسيطة للاستشارات الطبية والنفسية والتعليم المهني' },
        ru: { home:'Главная', specialists:'Специалисты', questions:'Вопросы', dashboard:'Мой кабинет', login:'Войти', ask:'Задать вопрос', search:'Поиск', slogan:'Просто и легко: медицинские консультации и professional обучение' }
      };

      let lang = localStorage.getItem('sb_lang') || 'ar';
      let currentPath = window.location.hash || '#/';
      let activeUser = { email: 'doctor@test.com' };
      let walletStats = { balance: 1450.00, total_earned: 3820.00 };
      
      let dbQuestions = [
        { title: 'ما أعراض القلق التي تستدعي استشارة نفسية فورية؟', body: 'أعاني من نوبات هلع مستمرة وتوتر دائم يؤثر على عملي اليومي.', status: 'active' },
        { title: 'كيف يمكن بناء خطة تعديل سلوك مهارات متكاملة لطفل توحد؟', body: 'أبحث عن متخصص في تحليل السلوك التطبيقي ABA للإشراف على حالة ابني.', status: 'new' }
      ];

      function handleLogin(email, password) {
        activeUser = { email: email };
        window.location.hash = '#/';
        render();
      }

      const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
      const tr = key => (I18N[lang] && I18N[lang][key]) || I18N.ar[key] || key;

      function header() {
        let optionsHtml = '';
        for (const [k, v] of Object.entries(LANGS)) {
          optionsHtml += `<option value="${k}" ${k === lang ? 'selected' : ''}>${esc(v)}</option>`;
        }

        return `<header class="top" style="background: #1e293b; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-family: sans-serif;">
          <a class="logo" href="#/" style="color: white; font-weight: bold; text-decoration: none; font-size: 20px;">✚ سهل وبسيط</a>
          <nav class="nav" style="display: flex; gap: 20px;">
            <a href="#/" style="color: white; text-decoration: none; font-weight: 500;">${esc(tr('home'))}</a>
            <a href="#/questions" style="color: white; text-decoration: none; font-weight: 500;">${esc(tr('questions'))}</a>
            <a href="#/dashboard" style="color: white; text-decoration: none; font-weight: 500;">${esc(tr('dashboard'))}</a>
          </nav>
          <div>
            <select id="langSelect" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; margin-left: 10px;">${optionsHtml}</select>
            ${activeUser ? `<span style="background: #334155; padding: 6px 12px; border-radius: 4px; font-size: 14px;">${esc(activeUser.email)}</span>` : `<a href="#/login" style="color: white; margin-left:10px; text-decoration: none;">${esc(tr('login'))}</a>`}
          </div>
        </header>`;
      }

      function viewHome() {
        return `<div style="padding:40px 20px; max-width: 1200px; margin: 0 auto; font-family: sans-serif; text-align: start;">
          <h2 style="font-size: 32px; color: #0f172a; margin-bottom: 10px;">${esc(tr('slogan'))}</h2>
          <p style="color: #64748b; font-size: 18px; margin-bottom: 30px;">نظام إدارة العيادات، الصيدليات، التدريب المهني التراكمي، والأكاديمية الطبية المتكاملة.</p>
          <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:25px; margin-top:20px;">
            <div style="background:#fff; padding:25px; border-radius:12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);">
              <h3 style="font-size: 22px; color: #0f172a; margin-bottom: 10px;">🩺 العيادات والأخصائيون (المراحل 10-16)</h3>
              <p style="color: #475569; line-height: 1.6; margin-bottom: 15px;">استشارات طبية، نفسية، وجلسات مرئية عبر الـ WebRTC مؤمنة بالكامل للغات الثمانية.</p>
              <a href="#/questions" style="color:#0284c7; text-decoration: none; font-weight: bold;">تصفح الاستشارات الطبية الحية ←</a>
            </div>
            <div style="background:#fff; padding:25px; border-radius:12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);">
              <h3 style="font-size: 22px; color: #0f172a; margin-bottom: 10px;">💊 الصيدلية وسوق المعدات (المراحل 20-24)</h3>
              <p style="color: #475569; line-height: 1.6; margin-bottom: 15px;">متجر الأدوية الذكي، تتبع المندوبين حياً بالـ Realtime، وإدارة الشحن وتوزيع نسب الأرباح.</p>
              <a href="#/" style="color:#0284c7; text-decoration: none; font-weight: bold;">فتح المتجر الطبي والصيدلية ←</a>
            </div>
            <div style="background:#fff; padding:25px; border-radius:12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);">
              <h3 style="font-size: 22px; color: #0f172a; margin-bottom: 10px;">🎓 الأكاديمية والمكتبة الرقمية (المرحلة 25-26)</h3>
              <p style="color: #475569; line-height: 1.6; margin-bottom: 15px;">كورسات تخصصية معتمدة (ABA, Neuropsychology, CBT) ونظام التضخيم التراكمي الآلي للمحتوى.</p>
              <a href="#/" style="color:#0284c7; text-decoration: none; font-weight: bold;">دخول مكتبة العلوم والشهادات ←</a>
            </div>
          </div>
        </div>`;
      }

      function viewQuestions() {
        let listHtml = '';
        dbQuestions.forEach(q => {
          listHtml += `
            <div style="background:#fff; border:1px solid #e2e8f0; padding:20px; border-radius:10px; margin-bottom:15px; text-align: start; box-shadow: 0 2px 4px rgb(0 0 0 / 0.02);">
              <h4 style="font-size: 18px; color: #0f172a; margin-bottom: 8px;">${esc(q.title)}</h4>
              <p style="color:#475569; line-height: 1.5; margin-bottom: 12px;">${esc(q.body)}</p>
              <span style="background:#e0f2fe; color:#0369a1; padding:4px 10px; border-radius:6px; font-size:12px; font-weight: bold;">باقة الاستشارة: ${esc(q.status === 'active' ? 'Plus (المعززة)' : 'Basic (الأساسية)')}</span>
            </div>`;
        });

        return `<div style="padding:40px 20px; max-width: 800px; margin: 0 auto; font-family: sans-serif; text-align: start; direction: rtl;">
          <h2 style="font-size: 28px; color: #0f172a; margin-bottom: 10px;">📌 نظام الأسئلة والاستشارات الطبية الحية</h2>
          <p style="color: #64748b; margin-bottom: 25px;">مستخرج حياً ومتوافق مع باقات التسعير وأنظمة الجدولة الرقمية داخل السيرفر.</p>
          <div style="margin-bottom: 25px;"><a href="#/ask" style="background:#0284c7; color:white; padding:12px 20px; border-radius:6px; text-decoration:none; font-weight: bold; box-shadow: 0 2px 4px rgb(2 132 199 / 0.2);">+ اطرح استشارتك الآن</a></div>
          ${listHtml}
        </div>`;
      }

      function viewDashboard() {
        return `<div style="padding:40px 20px; max-width: 800px; margin: 0 auto; font-family: sans-serif; text-align: start; direction: rtl;">
          <h2 style="font-size: 28px; color: #0f172a; margin-bottom: 20px;">💼 لوحة التحكم الشاملة والتدقيق المالي (Dashboard)</h2>
          <div style="background:#f0fdf4; border:1px solid #bbf7d0; padding:25px; border-radius:12px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.02);">
            <h4 style="font-size: 18px; color: #16a34a; margin-bottom: 10px;">💰 نظام الـ Ledger المالي وحساب الضمان المشفر:</h4>
            <p style="font-size: 16px; color: #334155; margin-bottom: 8px;">الرصيد المتاح للسحب حالياً: <span style="font-size:24px; color:#16a34a; font-weight:bold;">${walletStats.balance.toFixed(2)} USD</span></p>
            <p style="font-size: 16px; color: #334155;">إجمالي الإيرادات والأرباح المحققة: <strong style="color: #0f172a;">${walletStats.total_earned.toFixed(2)} USD</strong></p>
          </div>
        </div>`;
      }

      function viewLogin() {
        return `<div style="padding:60px 20px; max-width:400px; margin: 0 auto; text-align: center; direction: rtl; font-family: sans-serif;">
          <h2 style="color: #0f172a; font-size: 26px;">تسجيل الدخول للمنصة</h2>
          <p style="color: #64748b; margin-bottom: 20px;">ادخل باستخدام أحد حسابات الاختبار الـ 8 المعتمدة</p>
          <div style="display:flex; flex-direction:column; gap:15px; margin-top:20px;">
            <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" style="padding:12px; border:1px solid #cbd5e1; border-radius:6px; font-size: 15px;">
            <input type="password" id="loginPassword" placeholder="كلمة المرور" style="padding:12px; border:1px solid #cbd5e1; border-radius:4px; font-size: 15px;">
            <button id="loginBtn" style="background:#0284c7; color:white; padding:12px; border:none; border-radius:6px; cursor:pointer; font-weight: bold; font-size: 16px;">دخول آمن</button>
          </div>
        </div>`;
      }

      function render() {
        let content = viewHome();
        if (currentPath === '#/questions') content = viewQuestions();
        else if (currentPath === '#/dashboard') content = viewDashboard();
        else if (currentPath === '#/login') content = viewLogin();

        root.innerHTML = `
          ${header()}
          <div style="min-height: 85vh; background:#f8fafc; padding-bottom: 40px;">${content}</div>
        `;

        const langSelect = document.getElementById('langSelect');
        if (langSelect) {
